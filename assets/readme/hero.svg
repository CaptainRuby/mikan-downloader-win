      <path d="M22 18H37L46 27V47H22Z" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <path d="M37 18V28H46" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="58" y="26" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">.torrent</text>
