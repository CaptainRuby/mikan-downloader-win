      <circle cx="34" cy="34" r="20" fill="none" stroke="url(#orange)" stroke-width="8" stroke-dasharray="13 6"/>
      <circle cx="34" cy="34" r="5" fill="#ff7900"/>
      <text x="84" y="27" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="750">Mikan RSS</text>
      <text x="84" y="52" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">发现订阅更新</text>
    </g>

    <path d="M60 164V188" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

