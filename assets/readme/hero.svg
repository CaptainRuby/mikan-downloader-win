      <path d="M22 34L31 43L48 23" fill="none" stroke="#5e9425" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="26" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="750">BitComet</text>
